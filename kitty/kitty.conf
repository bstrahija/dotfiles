# vim:fileencoding=utf-8
# Catppuccin Mocha + Ghostty-inspired Kitty configuration for macOS.

# Fonts
font_family      MonaspiceKr Nerd Font
font_size        12.0
modify_font      underline_position 40%
modify_font      underline_thickness 40%
modify_font      cell_height 150%

# Cursor
cursor_shape           block
cursor_blink_interval  0

# Window
hide_window_decorations       titlebar-only
macos_titlebar_color          background
confirm_os_window_close       0
remember_window_size          yes
remember_window_position      yes
window_padding_width          8 12
placement_strategy            center
tab_bar_min_tabs              2
enabled_layouts               splits,tall,stack,grid,vertical,horizontal,fat

# Transparency and split focus
background_opacity    0.85
background_blur       30
inactive_text_alpha   0.4
inactive_border_color #333333

# Match Ghostty's relaxed paste behavior: never prompt, but neutralize unsafe
# control sequences rather than passing them through unchanged.
paste_actions replace-dangerous-control-codes

# Navigate Kitty splits with the same Option+h/j/k/l bindings as Ghostty.
map alt+h neighboring_window left
map alt+j neighboring_window bottom
map alt+k neighboring_window top
map alt+l neighboring_window right

# Keep Kitty's macOS config controls available explicitly.
map cmd+,      edit_config_file
map ctrl+cmd+, load_config_file

# Session leader: F6, then one of the keys below. Kitty sessions
# are saved layouts (tabs, splits, programs, and working directories).
map --new-mode kitty_session --on-action end --on-unknown end --timeout 3.0 f6
map --mode kitty_session l goto_session ~/.local/share/kitty/sessions
map --mode kitty_session n save_as_session --save-only --use-foreground-process --base-dir ~/.local/share/kitty/sessions
map --mode kitty_session esc pop_keyboard_mode

# Catppuccin Mocha
